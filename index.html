<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Usuários</h2>
	<form id="formCadastro">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>

            <label for="celular">Celular:</label>
            <input type="text" id="celular" maxlength="15" placeholder="(00) 00000-0000" required>

            <label for="email">Email:</label>
            <input type="text" id="email" required>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" maxlenght="9" placeholder="00000-000" required>

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" required>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" required>

            <label for="complemento">Complemento</label>
            <input type="text" id="complemento">

            <button type="submit">Enviar</button>

            <div class="mensagem" id="mensagemSucesso">
                Dados enviados com sucesso!
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById("formCadastro");
        const mensagem = document.getElementById("mensagemSucesso");

        form.addEventListener("submit", function(event) {
            event.preventDefault(); // impede recarregar a página

            // Aqui você poderia enviar para backend futuramente

            mensagem.style.display = "block";

            // opcional: limpar formulário
            form.reset();
        });
    </script>
</body>
</html>
